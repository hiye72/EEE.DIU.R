<style>
:root{

  --text:#0b1220;
  --text-2:rgba(11,18,32,.70);
  --text-3:rgba(11,18,32,.52);
  --glass:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.78);
  --sheen:rgba(255,255,255,.65);
  --shadow:0 12px 32px -14px rgba(15,23,42,.28),0 2px 6px -2px rgba(15,23,42,.08);
  --highlight:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.30);
  --seg-bg:rgba(15,23,42,.06);
  --thumb:rgba(255,255,255,.92);
  --thumb-shadow:0 3px 10px -2px rgba(15,23,42,.18),0 1px 2px rgba(15,23,42,.08),inset 0 1px 0 #fff;
  --chip:rgba(15,23,42,.06);
  --divider:rgba(15,23,42,.08);
  --sub-bg:rgba(255,255,255,.46);
  --sub-border:rgba(255,255,255,.75);
  --theory:#17663f;
  --theory-tint:rgba(52,199,89,.17);
  --theory-border:rgba(52,199,89,.38);
  --lab:#0b55a3;
  --lab-tint:rgba(10,132,255,.15);
  --lab-border:rgba(10,132,255,.36);
  --today:#8a4500;
  --today-tint:rgba(255,159,10,.20);

    --glass:rgba(30,34,46,.46);
    --glass-border:rgba(255,255,255,.13);
    --sheen:rgba(255,255,255,.07);
    --shadow:0 16px 40px -16px rgba(0,0,0,.75),0 2px 8px -2px rgba(0,0,0,.5);
    --highlight:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.04);
    --seg-bg:rgba(255,255,255,.07);
    --thumb:rgba(255,255,255,.17);

    --theory:#86e8b0;
    --theory-tint:rgba(48,209,88,.15);
    --theory-border:rgba(48,209,88,.34);

    --lab-border:rgba(64,156,255,.38);

    --blob-2:#0c3f86;
    --blob-3:#4b1e66;

@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.9)}
  @media (prefers-color-scheme:dark){:root{--glass:rgba(26,30,40,.94)}}
}
@media (prefers-contrast:more){
  :root{--glass:rgba(255,255,255,.92);--glass-border:rgba(15,23,42,.35);--text-2:rgba(11,18,32,.85)}
  @media (prefers-color-scheme:dark){:root{--glass:rgba(22,26,36,.95);--glass-border:rgba(255,255,255,.4);--text-2:rgba(243,246,251,.9)}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 12px)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:var(--font);font-size:15px;line-height:1.45;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  padding-top:calc(var(--header-h) + 6px);
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}

/* Ambient liquid background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(72px);opacity:var(--blob-opacity);transform:translateZ(0)}
.bg i:nth-child(1){width:60vmax;height:60vmax;top:-22vmax;left:-18vmax;background:var(--blob-1)}
.bg i:nth-child(2){width:52vmax;height:52vmax;top:8vmax;right:-22vmax;background:var(--blob-2)}
.bg i:nth-child(3){width:50vmax;height:50vmax;bottom:-26vmax;left:6vmax;background:var(--blob-3)}
.bg i:nth-child(4){width:34vmax;height:34vmax;bottom:-8vmax;right:-6vmax;background:var(--blob-4);opacity:calc(var(--blob-opacity) * .7)}

/* Glass primitive */
.glass{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow),var(--highlight);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 85% at 0% 0%,var(--sheen),transparent 55%);
}
.glass>*{position:relative}

/* Top bar */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  transition:transform .45s var(--ease),opacity .35s ease;
  will-change:transform,opacity;
}
.topbar.is-hidden{transform:translateY(calc(-100% - 14px));opacity:0;pointer-events:none}
.topbar-inner{max-width:1120px;margin:0 auto;padding:10px;border-radius:26px;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 0 8px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand-title{font-size:17px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.segmented{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--seg-bg);flex:none}
.segmented button{
  position:relative;z-index:1;appearance:none;border:0;background:transparent;cursor:pointer;
  min-width:68px;padding:8px 20px;border-radius:999px;
  font-size:15px;font-weight:650;letter-spacing:.01em;color:var(--text-2);
  transition:color .25s ease;
}
.segmented button[aria-checked="true"]{color:var(--text)}
.thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--thumb);box-shadow:var(--thumb-shadow);transition:transform .5s var(--spring),width .5s var(--spring)}
.segmented .thumb{border-radius:999px}
.no-anim .thumb{transition:none!important}

.daynav-track{
  position:relative;display:flex;gap:2px;padding:4px;border-radius:18px;background:var(--seg-bg);
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.daynav-track::-webkit-scrollbar{display:none}
.daynav-track .thumb{border-radius:14px}
.day-btn{
  position:relative;z-index:1;flex:1 0 auto;appearance:none;border:0;background:transparent;cursor:pointer;
  padding:9px 14px;border-radius:14px;white-space:nowrap;
  font-size:14px;font-weight:600;color:var(--text-2);transition:color .25s ease;
}
.day-btn[aria-selected="true"]{color:var(--text)}
.day-btn.is-off:not([aria-selected="true"]){color:var(--text-3)}
.today-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--note);box-shadow:0 0 0 2px var(--note-ring)}
.lbl-long{display:none}
@media (min-width:820px){.lbl-long{display:inline}.lbl-short{display:none}}

/* Layout */
.container{max-width:1120px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left)) 28px}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:6px 4px 18px}
.summary-stats{margin:0;font-size:13px;color:var(--text-2);font-weight:500}
.summary-stats strong{color:var(--text);font-weight:700}
.legend{display:flex;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:650;color:var(--text-2)}
.legend i{width:8px;height:8px;border-radius:50%}
.legend .lg-theory i{background:var(--theory)}
.legend .lg-lab i{background:var(--lab)}

.day-group{margin:0 0 28px}
.day-head{display:flex;align-items:center;gap:8px;margin:0 6px 12px;flex-wrap:wrap}
.day-head h2{margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em}
.tag-today{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:var(--today);background:var(--today-tint)}
.day-count{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--text-2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}

/* Cards */
.card{
  border-radius:var(--radius);padding:16px 16px 14px 20px;
  background:linear-gradient(140deg,var(--tint) 0%,transparent 70%),var(--glass);
  animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.card--theory{--tint:var(--theory-tint);--accent:var(--theory);--accent-border:var(--theory-border)}
.card--lab{--tint:var(--lab-tint);--accent:var(--lab);--accent-border:var(--lab-border)}
.card::after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--accent);opacity:.9}
.card.is-now{
  padding-bottom:22px;
  box-shadow:var(--shadow),var(--highlight),0 0 0 2px var(--accent-border);
  animation:rise .55s var(--ease) backwards,glow 2.2s ease-in-out .55s infinite;
}
.no-anim .card.is-now{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{
  0%,100%{box-shadow:var(--shadow),var(--highlight),0 0 0 2px var(--accent-border),0 0 14px 0 var(--accent-border)}
  50%{box-shadow:var(--shadow),var(--highlight),0 0 0 2px var(--accent),0 0 34px 6px var(--accent-border)}
}
/* Live progress bar */
.progress{position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;background:var(--chip)}
.progress i{display:block;height:100%;width:0;border-radius:0 6px 6px 0;background:hsl(0 85% 50%);box-shadow:0 0 10px currentColor;transition:width 1s linear,background-color 1s linear,color 1s linear}
.card:focus-within,.card:has(.note-dot.open){z-index:5}
@media (hover:hover){.card:hover{transform:translateY(-2px)}}
.no-anim .card{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

.sub{background:var(--sub-bg);border:1px solid var(--sub-border);border-radius:14px}
.card-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.card-top .time{padding:6px 8px;border-radius:12px;white-space:nowrap;font-size:13.5px;gap:5px}
.card-top .pills{gap:5px}
.card-top .badge{padding:4px 8px}
.card-top .pills{margin-left:auto}
.course-box{padding:10px 12px}
.time{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--text)}
.time svg{color:var(--accent);flex:none}
.pills{display:inline-flex;align-items:center;gap:6px;flex:none}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--accent);background:var(--tint);border:1px solid var(--accent-border)}
.live,.next{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--chip);color:var(--text)}
.live i{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:pulse 1.6s ease-out infinite,blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}100%{box-shadow:0 0 0 7px rgba(255,59,48,0)}}

.course{margin:0;font-size:17px;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.code{display:flex;align-items:center;gap:6px;margin:3px 0 0;font-size:12.5px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
.meta{display:grid;gap:8px;margin-top:8px}
.meta-row{display:flex;align-items:center;gap:10px;min-width:0;padding:7px 10px 7px 7px}
.meta-icon{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--accent)}
.meta-text{min-width:0}
.meta-label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.meta-value{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.initial{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text-2);background:var(--chip);text-decoration:none;vertical-align:1px}

/* Break bar between classes */
.break-bar{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-radius:16px;
  animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms);
}
.no-anim .break-bar{animation:none}
.break-icon{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--today-tint);color:var(--today)}
.break-text{display:flex;flex-direction:column;min-width:0}
.break-time{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--text)}
.break-time b{font-weight:750;color:var(--today);margin-left:4px}
.break-len{font-size:12.5px;font-weight:550;color:var(--text-2);font-variant-numeric:tabular-nums}

/* Minimal note indicator */
.note-dot{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;flex:none}
.note-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--note);box-shadow:0 0 0 3px var(--note-ring)}
.note-tip{
  position:absolute;top:calc(100% + 6px);left:-6px;z-index:10;
  width:max-content;max-width:min(260px,calc(100vw - 56px));
  padding:7px 10px;border-radius:10px;font-size:12px;font-weight:550;line-height:1.35;text-align:left;
  color:var(--tip-text);background:var(--tip-bg);box-shadow:0 8px 24px -8px rgba(0,0,0,.4);
  opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .18s ease,transform .18s ease;
}
.note-dot.open .note-tip{opacity:1;transform:none}
@media (hover:hover){.note-dot:hover .note-tip{opacity:1;transform:none}}

/* Empty states */
.empty{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;color:var(--text-2);font-weight:550;font-size:14px}
.empty svg{flex:none;color:var(--text-3)}
.empty--lg{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:44px 20px;border-radius:var(--radius)}
.empty--lg strong{color:var(--text);font-size:17px;font-weight:700}

.footer{max-width:1120px;margin:0 auto;padding:4px 20px max(28px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--text-3)}
.footer p{margin:2px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.noscript{max-width:560px;margin:40px auto;padding:20px;border-radius:18px;text-align:center}

@media (max-width:420px){
  .segmented button{min-width:58px;padding:7px 16px;font-size:14px}
  .brand-title{font-size:16px}
  .day-btn{padding:8px 12px;font-size:13.5px}
  .day-head h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media print{
  .bg,.topbar,.legend,.note-dot{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:#fff;box-shadow:none;border:1px solid #ccc}
  .card,.day-group{break-inside:avoid}
}
</style>

  const DAYS = ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const DAY_NOTES = { Sunday: "Departmental Meeting & OBE Session, 11:30 AM – 12:30 PM" };
  const TIME_ZONE = "Asia/Dhaka";
  const STORAGE_KEY = "diu-eee-1-2F-section";

  /* ---------- Helpers ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fmtTime = t => {
    const [h, m] = t.split(":").map(Number);
    return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + " " + (h >= 12 ? "PM" : "AM");
  };
  const fmtDuration = (a, b) => {
    const mins = toMin(b) - toMin(a);
    if (mins % 60) return mins + " min";
    const h = mins / 60;
    return h + (h === 1 ? " hr" : " hrs");
  };
  const fmtMins = mins => {
    const h = Math.floor(mins / 60), m = mins % 60;
    if (!h) return m + " min";
    return h + (h === 1 ? " hr" : " hrs") + (m ? " " + m + " min" : "");
  };
  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "es");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sortClasses = (a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || toMin(a.start) - toMin(b.start);

  const DB = new Map(ROUTINE.map(r => [r.section, r.classes.slice().sort(sortClasses)]));
  const SECTIONS = ROUTINE.map(r => r.section);

  function nowInDhaka() {
    try {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: TIME_ZONE, weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
      const get = type => (parts.find(p => p.type === type) || {}).value;
      const minutes = (Number(get("hour")) % 24) * 60 + Number(get("minute"));
      return { day: get("weekday"), minutes, seconds: minutes * 60 + Number(get("second")) };
    } catch (e) {
      const d = new Date();
      return { day: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getDay()], minutes: d.getHours() * 60 + d.getMinutes(), seconds: d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() };
    }
  }

  const ICON = {
    coffee: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>',
    clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-3.8 4.6-5.7 8-5.7s6.4 1.9 8 5.7"/></svg>',
    room: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.4A7 7 0 0 1 19 9.6C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.6" r="2.5"/></svg>',
    calendar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    calendarLg: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5l2 2 4-4"/></svg>'
  };

  /* ---------- State ---------- */
  const state = { section: SECTIONS[0], day: "all" };
  const els = {
    topbar: $("#topbar"),
    seg: $("#segmented"),
    track: $("#dayTrack"),
    view: $("#view"),
    summary: $("#summary")
  };
  let liveSignature = "";

  function readState() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    const [hSec, hDay] = hash.split("/");
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
    const sec = [hSec, saved].map(v => (v || "").toUpperCase()).find(v => SECTIONS.includes(v));
    state.section = sec || SECTIONS[0];
    const day = (hDay || "").toLowerCase();
    state.day = day === "all" || DAYS.some(d => d.toLowerCase() === day) ? day : "all";
  }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, state.section); } catch (e) { /* storage unavailable */ }
    const hash = "#" + state.section + "/" + state.day;
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }

  /* ---------- Controls ---------- */
  function buildControls() {
    els.seg.insertAdjacentHTML("beforeend", SECTIONS.map(s =>
      '<button type="button" role="radio" aria-checked="false" data-section="' + s + '">' + s + "</button>").join(""));

    const items = [{ key: "all", short: "All", long: "All" }].concat(DAYS.map(d => ({ key: d.toLowerCase(), short: d.slice(0, 3), long: d })));
    els.track.insertAdjacentHTML("beforeend", items.map(it =>
      '<button type="button" class="day-btn" role="tab" id="tab-' + it.key + '" aria-controls="view" aria-selected="false" tabindex="-1" data-day="' + it.key + '">' +
      '<span class="lbl-short">' + it.short + '</span><span class="lbl-long">' + it.long + "</span></button>").join(""));
    els.view.setAttribute("aria-labelledby", "tab-all");
  }

  function moveThumb(container, btn) {
    const thumb = $(".thumb", container);
    if (!thumb || !btn) return;
    thumb.style.width = btn.offsetWidth + "px";
    thumb.style.transform = "translateX(" + btn.offsetLeft + "px)";
  }

  function centerActiveDay(smooth) {
    const btn = $('.day-btn[aria-selected="true"]', els.track);
    if (!btn || els.track.scrollWidth <= els.track.clientWidth) return;
    const left = btn.offsetLeft - (els.track.clientWidth - btn.offsetWidth) / 2;
    els.track.scrollTo({ left: Math.max(0, left), behavior: smooth && !reduceMotion.matches ? "smooth" : "auto" });
  }

  function syncControls(smooth) {
    $$("button", els.seg).forEach(b => b.setAttribute("aria-checked", String(b.dataset.section === state.section)));
    const classes = DB.get(state.section);
    const today = nowInDhaka().day;
    $$(".day-btn", els.track).forEach(b => {
      const key = b.dataset.day;
      const selected = key === state.day;
      const dayName = DAYS.find(d => d.toLowerCase() === key);
      const isToday = dayName === today;
      b.setAttribute("aria-selected", String(selected));
      b.tabIndex = selected ? 0 : -1;
      b.classList.toggle("is-off", !!dayName && !classes.some(c => c.day === dayName));
      b.setAttribute("aria-label", key === "all" ? "All days" : dayName + (isToday ? " (today)" : ""));
      const dot = $(".today-dot", b);
      if (isToday && !dot) b.insertAdjacentHTML("beforeend", '<span class="today-dot" aria-hidden="true"></span>');
      if (!isToday && dot) dot.remove();
    });
    els.view.setAttribute("aria-labelledby", "tab-" + state.day);
    moveThumb(els.seg, $('button[aria-checked="true"]', els.seg));
    moveThumb(els.track, $('.day-btn[aria-selected="true"]', els.track));
    centerActiveDay(smooth);
  }

  function rovingKeys(container, selector, onPick) {
    container.addEventListener("keydown", e => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
      const btns = $$(selector, container);
      const i = btns.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      let n = i;
      if (e.key === "ArrowRight") n = (i + 1) % btns.length;
      if (e.key === "ArrowLeft") n = (i - 1 + btns.length) % btns.length;
      if (e.key === "Home") n = 0;
      if (e.key === "End") n = btns.length - 1;
      btns[n].focus();
      onPick(btns[n]);
    });
  }

  /* ---------- Rendering ---------- */
  function noteHTML(text) {
    return '<button type="button" class="note-dot" aria-label="Note: ' + esc(text) + '" aria-expanded="false"><span class="note-tip" role="tooltip">' + esc(text) + "</span></button>";
  }

  function getLiveStatus(classes, now) {
    const todays = classes.filter(c => c.day === now.day);
    const current = todays.find(c => toMin(c.start) <= now.minutes && now.minutes < toMin(c.end)) || null;
    const next = todays.find(c => toMin(c.start) > now.minutes) || null;
    return { current, next };
  }

  const progressOf = (c, now) => {
    const s0 = toMin(c.start) * 60, s1 = toMin(c.end) * 60;
    return Math.min(1, Math.max(0, (now.seconds - s0) / (s1 - s0)));
  };
  const progressStyle = p => "width:" + (p * 100).toFixed(2) + "%;background-color:hsl(" + Math.round(p * 120) + " 85% 45%);color:hsl(" + Math.round(p * 120) + " 85% 45%)";

  function progressHTML(c) {
    return '<div class="progress" aria-hidden="true"><i data-start="' + c.start + '" data-end="' + c.end + '" style="' + progressStyle(progressOf(c, nowInDhaka())) + '"></i></div>';
  }

  function updateProgress(now) {
    $$(".progress i", els.view).forEach(bar => {
      bar.setAttribute("style", progressStyle(progressOf({ start: bar.dataset.start, end: bar.dataset.end }, now)));
    });
  }

  function cardHTML(c, i, status) {
    const type = c.type.toLowerCase();
    const pill = status === "now" ? '<span class="live"><i aria-hidden="true"></i>Now</span>' : status === "next" ? '<span class="next">Up next</span>' : "";
    return '<article class="card glass card--' + type + (status === "now" ? " is-now" : "") + '" style="--i:' + i + '" aria-label="' +
      esc(c.courseName + ", " + c.type + ", " + fmtTime(c.start) + " to " + fmtTime(c.end) + ", Room " + c.room + ", " + c.teacherName) + '">' +
      '<div class="card-top"><span class="time sub">' + ICON.clock + "<span>" + fmtTime(c.start) + " – " + fmtTime(c.end) + "</span></span>" +
      '<span class="pills">' + pill + '<span class="badge">' + esc(c.type) + "</span></span></div>" +
      '<div class="course-box sub"><h3 class="course">' + esc(c.courseName) + "</h3>" +
      '<p class="code"><span>' + esc(c.courseCode) + "</span><span aria-hidden=\"true\">·</span><span>" + fmtDuration(c.start, c.end) + "</span>" + (c.note ? noteHTML(c.note) : "") + "</p></div>" +
      '<div class="meta">' +
        '<div class="meta-row sub"><span class="meta-icon">' + ICON.user + '</span><span class="meta-text"><span class="meta-label">Teacher</span><span class="meta-value">' + esc(c.teacherName) + '<abbr class="initial" title="Teacher initial">' + esc(c.teacherInitial) + "</abbr></span></span></div>" +
        '<div class="meta-row sub"><span class="meta-icon">' + ICON.room + '</span><span class="meta-text"><span class="meta-label">Room</span><span class="meta-value">' + esc(c.room) + "</span></span></div>" +
      "</div>" + (status === "now" ? progressHTML(c) : "") + "</article>";
  }

  function breakHTML(prev, next, i) {
    const mins = toMin(next.start) - toMin(prev.end);
    return '<div class="break-bar glass" role="note" style="--i:' + i + '" aria-label="Break from ' + fmtTime(prev.end) + " to " + fmtTime(next.start) + ", " + fmtMins(mins) + '">' +
      '<span class="break-icon">' + ICON.coffee + "</span>" +
      '<span class="break-text"><span class="break-time">' + fmtTime(prev.end) + " – " + fmtTime(next.start) + "<b>Break</b></span>" +
      '<span class="break-len">' + fmtMins(mins) + "</span></span></div>";
  }

  function dayGroupHTML(day, classes, now, live, single, offset) {
    const isToday = day === now.day;
    const head = '<header class="day-head"><h2 id="h-' + day.toLowerCase() + '">' + day + "</h2>" +
      (isToday ? '<span class="tag-today">Today</span>' : "") +
      (DAY_NOTES[day] ? noteHTML(DAY_NOTES[day]) : "") +
      '<span class="day-count">' + (classes.length ? plural(classes.length, "class") : "Off day") + "</span></header>";

    let body;
    if (!classes.length) {
      body = single
        ? '<div class="empty empty--lg glass">' + ICON.calendarLg + "<strong>No classes on " + day + "</strong><span>Enjoy your day off.</span></div>"
        : '<div class="empty glass">' + ICON.calendar + "<span>No classes · Off day</span></div>";
    } else {
      body = '<div class="grid">' + classes.map((c, i) => {
        const status = isToday ? (c === live.current ? "now" : c === live.next ? "next" : "") : "";
        const prev = classes[i - 1];
        const gap = prev && toMin(c.start) > toMin(prev.end) ? breakHTML(prev, c, offset + i) : "";
        return gap + cardHTML(c, offset + i, status);
      }).join("") + "</div>";
    }
    return '<section class="day-group" aria-labelledby="h-' + day.toLowerCase() + '">' + head + body + "</section>";
  }

  function render(animate) {
    const classes = DB.get(state.section);
    const now = nowInDhaka();
    const live = getLiveStatus(classes, now);
    liveSignature = signature(now, live);

    const selDay = DAYS.find(d => d.toLowerCase() === state.day);
    const scoped = selDay ? classes.filter(c => c.day === selDay) : classes;
    const minutes = scoped.reduce((sum, c) => sum + toMin(c.end) - toMin(c.start), 0);
    els.summary.innerHTML =
      '<p class="summary-stats"><strong>Section ' + state.section + "</strong> · " + (selDay || "All days") + " · " +
      (scoped.length ? plural(scoped.length, "class") + " · " + fmtMins(minutes) + " total" : "Off day") + "</p>" +
      '<div class="legend" aria-hidden="true"><span class="glass lg-theory"><i></i>Theory</span><span class="glass lg-lab"><i></i>Lab</span></div>';

    const days = state.day === "all" ? DAYS : DAYS.filter(d => d.toLowerCase() === state.day);
    let offset = 0;
    const html = days.map(day => {
      const list = classes.filter(c => c.day === day);
      const out = dayGroupHTML(day, list, now, live, state.day !== "all", Math.min(offset, 10));
      offset += list.length;
      return out;
    }).join("");

    els.view.classList.toggle("no-anim", !animate);
    els.view.innerHTML = html;
  }

  function signature(now, live) {
    const id = c => (c ? c.day + c.start : "-");
    return state.section + "|" + state.day + "|" + now.day + "|" + id(live.current) + "|" + id(live.next);
  }

  function update(opts) {
    const o = Object.assign({ animate: true, scroll: true, smooth: true }, opts);
    persist();
    syncControls(o.smooth);
    render(o.animate);
    if (o.scroll && window.scrollY > 0) {
      window.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
    }
  }

  /* ---------- Auto-hide navigation ---------- */
  function setupAutoHide() {
    let lastY = window.scrollY;
    let ticking = false;
    const keyboardFocusInside = () => {
      try { return !!els.topbar.querySelector(":focus-visible"); } catch (e) { return false; }
    };
    const setHidden = hidden => {
      if (hidden && keyboardFocusInside()) return;
      els.topbar.classList.toggle("is-hidden", hidden);
    };
    const onFrame = () => {
      const y = Math.max(0, window.scrollY);
      const dy = y - lastY;
      const threshold = els.topbar.offsetHeight * 0.6;
      if (y <= threshold) setHidden(false);
      else if (dy > 6) setHidden(true);
      else if (dy < -6) setHidden(false);
      if (Math.abs(dy) > 6 || y <= threshold) lastY = y;
      ticking = false;
    };
    window.addEventListener("scroll", () => {
      if (!ticking) { ticking = true; requestAnimationFrame(onFrame); }
    }, { passive: true });
    els.topbar.addEventListener("focusin", () => { if (keyboardFocusInside()) els.topbar.classList.remove("is-hidden"); });
  }

  function setupHeaderSize() {
    const apply = () => document.documentElement.style.setProperty("--header-h", els.topbar.offsetHeight + "px");
    apply();
    const reposition = () => {
      moveThumb(els.seg, $('button[aria-checked="true"]', els.seg));
      moveThumb(els.track, $('.day-btn[aria-selected="true"]', els.track));
    };
    if ("ResizeObserver" in window) {
      new ResizeObserver(() => { apply(); reposition(); }).observe(els.topbar);
    } else {
      window.addEventListener("resize", () => { apply(); reposition(); });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { apply(); reposition(); });
  }

  /* ---------- Notes (tap to reveal) ---------- */
  function closeNotes(except) {
    $$(".note-dot.open").forEach(n => {
      if (n !== except) { n.classList.remove("open"); n.setAttribute("aria-expanded", "false"); }
    });
  }

  /* ---------- Events ---------- */
  function bindEvents() {
    els.seg.addEventListener("click", e => {
      const btn = e.target.closest("button[data-section]");
      if (!btn || btn.dataset.section === state.section) return;
      state.section = btn.dataset.section;
      update({ scroll: false });
    });
    els.track.addEventListener("click", e => {
      const btn = e.target.closest(".day-btn");
      if (!btn || btn.dataset.day === state.day) return;
      state.day = btn.dataset.day;
      update();
    });
    rovingKeys(els.seg, "button[data-section]", btn => btn.click());
    rovingKeys(els.track, ".day-btn", btn => btn.click());

    document.addEventListener("click", e => {
      const dot = e.target.closest(".note-dot");
      closeNotes(dot);
      if (dot) {
        const open = !dot.classList.contains("open");
        dot.classList.toggle("open", open);
        dot.setAttribute("aria-expanded", String(open));
      }
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeNotes(null); });

    window.addEventListener("hashchange", () => {
      readState();
      update({ scroll: false });
    });

    const refreshLive = () => {
      const classes = DB.get(state.section);
      const now = nowInDhaka();
      if (signature(now, getLiveStatus(classes, now)) !== liveSignature) {
        syncControls(false);
        render(false);
      } else {
        updateProgress(now);
      }
    };
    setInterval(refreshLive, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshLive(); });
  }

  /* ---------- Init ---------- */
  function init() {
    buildControls();
    readState();
    // On open: always jump to 1-2 F2 and today's day (Dhaka time)
    state.section = SECTIONS.includes("F2") ? "F2" : SECTIONS[0];
    state.day = nowInDhaka().day.toLowerCase();
    setupHeaderSize();
    update({ scroll: false, smooth: false });
    setupAutoHide();
    bindEvents();
    requestAnimationFrame(() => {
      const liveCard = $(".card.is-now", els.view);
      if (!liveCard) return;
      const r = liveCard.getBoundingClientRect();
      if (r.top < els.topbar.offsetHeight || r.bottom > window.innerHeight) {
        liveCard.scrollIntoView({ block: "center", behavior: "auto" });
      }
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.seg.classList.remove("no-anim");
      els.track.classList.remove("no-anim");
    }));
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
